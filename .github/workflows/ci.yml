name: CI Test Suite

on:
  push:
    branches: [ "main", "feat/*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Pytest & Security Benchmark (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Syntax & Environment Check
        run: |
          python -m compileall core/ gateway/ main.py

      - name: Run Deterministic Security & SLA Gateway Test Suite
        env:
          OTARI_BASE_URL: "https://otari.ai/api/v1"
          OTARI_API_KEY: "mock_test_key"
          PRIMARY_TIMEOUT_SECONDS: "30.0"
          FALLBACK_TIMEOUT_SECONDS: "35.0"
        run: |
          python -m pytest tests/test_gateway.py -v --tb=short
