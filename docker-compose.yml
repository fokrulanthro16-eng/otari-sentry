version: "3.8"

services:
  otari-sentry:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: otari-sentry-gateway
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - ENVIRONMENT=production
      - OTARI_BASE_URL=${OTARI_BASE_URL:-https://otari.ai/api/v1}
      - OTARI_API_KEY=${OTARI_API_KEY}
      - PRIMARY_MODEL=${PRIMARY_MODEL:-alibaba/qwen-3.5-35b-a3b}
      - FALLBACK_MODEL=${FALLBACK_MODEL:-meta-llama/llama-3.3-70b-instruct}
      - PRIMARY_TIMEOUT_SECONDS=30.0
      - FALLBACK_TIMEOUT_SECONDS=35.0
      - AIRLOCK_ENABLED=true
      - SIMULATE_W3C_BAGGAGE=true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    env_file:
      - .env
    security_opt:
      - no-new-privileges:true
