<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="50%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Top Border Line Gradient -->
    <linearGradient id="topLine" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="35%" stop-color="#38bdf8"/>
      <stop offset="70%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <!-- Title Gradient -->
    <linearGradient id="titleGradient" x1="0" y1="0" x2="600" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="40%" stop-color="#818cf8"/>
      <stop offset="85%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>

    <!-- Shield Emblem Gradient -->
    <linearGradient id="shieldGrad" x1="0" y1="0" x2="80" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <!-- Ambient Glow Circles -->
    <radialGradient id="glowCyan" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPurple" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>

    <!-- Tech Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.3"/>
      <circle cx="40" cy="0" r="1" fill="#38bdf8" fill-opacity="0.2"/>
    </pattern>
  </defs>

  <!-- Canvas Base -->
  <rect width="1200" height="300" rx="14" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="14" fill="url(#grid)"/>

  <!-- Top Accent Highlight -->
  <rect x="0" y="0" width="1200" height="3" fill="url(#topLine)"/>

  <!-- Ambient Light Fields -->
  <circle cx="150" cy="150" r="180" fill="url(#glowCyan)"/>
  <circle cx="1050" cy="150" r="200" fill="url(#glowPurple)"/>

  <!-- Cybernetic Corner Accents -->
  <path d="M 24 44 L 24 24 L 44 24" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-opacity="0.7"/>
  <path d="M 1176 44 L 1176 24 L 1156 24" stroke="#818cf8" stroke-width="2" stroke-linecap="round" stroke-opacity="0.7"/>
  <path d="M 24 256 L 24 276 L 44 276" stroke="#34d399" stroke-width="2" stroke-linecap="round" stroke-opacity="0.7"/>
  <path d="M 1176 256 L 1176 276 L 1156 276" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-opacity="0.7"/>

  <!-- Security Shield Emblem -->
  <g transform="translate(90, 85)">
    <!-- Shield Outer -->
    <path d="M 45 0 L 85 24 L 85 64 C 85 96 45 120 45 120 C 45 120 5 96 5 64 L 5 24 Z" 
          fill="#0a0f1d" stroke="url(#shieldGrad)" stroke-width="3"/>
    <!-- Shield Inner Tech Core -->
    <path d="M 45 14 L 75 32 L 75 62 C 75 86 45 104 45 104 C 45 104 15 86 15 62 L 15 32 Z" 
          fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="5 3"/>
    <!-- Monogram OS -->
    <text x="45" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
          font-size="28" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1.5">OS</text>
    <!-- Live Status Dot -->
    <circle cx="75" cy="32" r="4.5" fill="#10b981"/>
    <circle cx="75" cy="32" r="2" fill="#ffffff"/>
  </g>

  <!-- Typography Content -->
  <g transform="translate(230, 0)">
    <!-- Category Pill -->
    <g transform="translate(0, 48)">
      <rect x="0" y="0" width="220" height="24" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <circle cx="12" cy="12" r="3.5" fill="#10b981"/>
      <text x="24" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
            font-size="11" font-weight="700" fill="#94a3b8" letter-spacing="1.5">ENTERPRISE AI GATEWAY</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="122" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
          font-size="52" font-weight="900" fill="url(#titleGradient)" letter-spacing="3.5">
      OTARI-SENTRY
    </text>

    <!-- Subtitle -->
    <text x="2" y="158" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
          font-size="20" font-weight="500" fill="#e2e8f0" letter-spacing="0.5">
      Enterprise AI Gateway &amp; Telemetry Control Plane
    </text>

    <!-- Tagline -->
    <text x="2" y="188" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" 
          font-size="13" font-weight="600" fill="#94a3b8" letter-spacing="1">
      &quot;Rules Engine Decides, AI Explains&quot; &#8226; Sub-Millisecond Policy Firewall
    </text>

    <!-- Feature Badges -->
    <g transform="translate(0, 214)">
      <!-- Badge 1: Sub-0.05ms Airlock -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="190" height="32" rx="8" fill="#042f2e" stroke="#10b981" stroke-width="1.2"/>
        <text x="14" y="20" font-family="ui-monospace, monospace" font-size="12" font-weight="700" fill="#34d399">⚡ Sub-0.05ms Airlock</text>
      </g>

      <!-- Badge 2: In-Memory Cache -->
      <g transform="translate(202, 0)">
        <rect x="0" y="0" width="180" height="32" rx="8" fill="#1e1b4b" stroke="#8b5cf6" stroke-width="1.2"/>
        <text x="14" y="20" font-family="ui-monospace, monospace" font-size="12" font-weight="700" fill="#c084fc">💾 In-Memory Cache</text>
      </g>

      <!-- Badge 3: Mozilla Otari Powered -->
      <g transform="translate(394, 0)">
        <rect x="0" y="0" width="210" height="32" rx="8" fill="#431407" stroke="#f97316" stroke-width="1.2"/>
        <text x="14" y="20" font-family="ui-monospace, monospace" font-size="12" font-weight="700" fill="#fb923c">🦊 Mozilla Otari Powered</text>
      </g>
    </g>
  </g>

  <!-- Right Decorative Telemetry Terminal -->
  <g transform="translate(1030, 65)">
    <rect x="0" y="0" width="120" height="170" rx="8" fill="#0a0f1d" stroke="#1e293b" stroke-width="1.2"/>
    <rect x="0" y="0" width="120" height="20" rx="8" fill="#0f172a"/>
    <circle cx="12" cy="10" r="3" fill="#ef4444"/>
    <circle cx="22" cy="10" r="3" fill="#f59e0b"/>
    <circle cx="32" cy="10" r="3" fill="#10b981"/>

    <!-- Telemetry Lines -->
    <text x="12" y="44" font-family="ui-monospace, monospace" font-size="9" font-weight="700" fill="#64748b">SCAN SLA</text>
    <text x="12" y="58" font-family="ui-monospace, monospace" font-size="12" font-weight="700" fill="#34d399">&lt; 0.05 ms</text>

    <text x="12" y="82" font-family="ui-monospace, monospace" font-size="9" font-weight="700" fill="#64748b">CACHE HIT</text>
    <text x="12" y="96" font-family="ui-monospace, monospace" font-size="12" font-weight="700" fill="#38bdf8">0.005 ms</text>

    <text x="12" y="120" font-family="ui-monospace, monospace" font-size="9" font-weight="700" fill="#64748b">LEAKAGE</text>
    <text x="12" y="134" font-family="ui-monospace, monospace" font-size="12" font-weight="700" fill="#ef4444">0 TOKENS</text>

    <text x="12" y="156" font-family="ui-monospace, monospace" font-size="10" font-weight="700" fill="#818cf8">SLA: CLOSED</text>
  </g>
</svg>
