<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1200" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#080c14"/>
      <stop offset="50%" stop-color="#0e1424"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>

    <!-- Neon Glow Filters -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="glowPurple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="20" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Brand Linear Gradients -->
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="45%" stop-color="#818cf8"/>
      <stop offset="85%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>

    <linearGradient id="shieldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.35"/>
      <circle cx="40" cy="0" r="1.2" fill="#38bdf8" fill-opacity="0.25"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="320" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Overlay -->
  <rect width="1200" height="320" rx="16" fill="url(#gridPattern)"/>

  <!-- Top Border Accent Line -->
  <rect x="0" y="0" width="1200" height="3" fill="url(#titleGrad)"/>

  <!-- Ambient Light Orbs -->
  <circle cx="180" cy="80" r="140" fill="#0284c7" fill-opacity="0.12" filter="url(#glowCyan)"/>
  <circle cx="1020" cy="240" r="160" fill="#7c3aed" fill-opacity="0.1" filter="url(#glowPurple)"/>
  <circle cx="600" cy="160" r="220" fill="#0f172a" fill-opacity="0.5"/>

  <!-- Cybernetic Corner Geometry -->
  <path d="M 30 50 L 30 30 L 50 30" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-opacity="0.6"/>
  <path d="M 1170 50 L 1170 30 L 1150 30" stroke="#818cf8" stroke-width="2" stroke-linecap="round" stroke-opacity="0.6"/>
  <path d="M 30 270 L 30 290 L 50 290" stroke="#34d399" stroke-width="2" stroke-linecap="round" stroke-opacity="0.6"/>
  <path d="M 1170 270 L 1170 290 L 1150 290" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-opacity="0.6"/>

  <!-- Central Shield / Security Emblem -->
  <g transform="translate(140, 160)">
    <!-- Shield Outer Glow -->
    <circle cx="0" cy="0" r="54" fill="#0284c7" fill-opacity="0.15" filter="url(#glowCyan)"/>
    
    <!-- Shield Background -->
    <path d="M 0 -48 L 40 -26 L 40 14 C 40 38 20 54 0 62 C -20 54 -40 38 -40 14 L -40 -26 Z" 
          fill="#090d16" stroke="url(#shieldGrad)" stroke-width="2.5"/>
    
    <!-- Shield Core Geometry -->
    <path d="M 0 -36 L 28 -20 L 28 10 C 28 28 14 40 0 46 C -14 40 -28 28 -28 10 L -28 -20 Z" 
          fill="url(#shieldGrad)" fill-opacity="0.15" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="4 2"/>
    
    <!-- Monogram 'OS' -->
    <text x="0" y="8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
          font-size="24" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">OS</text>
    
    <!-- Active Status Pulse -->
    <circle cx="28" cy="-20" r="4" fill="#10b981" filter="url(#subtleGlow)"/>
    <circle cx="28" cy="-20" r="2" fill="#ffffff"/>
  </g>

  <!-- Main Content Container -->
  <g transform="translate(230, 0)">

    <!-- Category Pill Header -->
    <g transform="translate(0, 56)">
      <rect x="0" y="0" width="220" height="24" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <circle cx="12" cy="12" r="3.5" fill="#10b981"/>
      <text x="24" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
            font-size="11" font-weight="700" fill="#94a3b8" letter-spacing="1.5">ENTERPRISE AI GATEWAY</text>
    </g>

    <!-- Main Title: OTARI-SENTRY -->
    <text x="0" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
          font-size="56" font-weight="900" fill="url(#titleGrad)" letter-spacing="3.5">
      OTARI-SENTRY
    </text>

    <!-- Subtitle: Deterministic Control Plane -->
    <text x="2" y="170" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
          font-size="20" font-weight="500" fill="#e2e8f0" letter-spacing="0.5">
      Deterministic Enterprise AI Gateway &amp; Telemetry Control Plane
    </text>

    <!-- Core Philosophy Callout -->
    <text x="2" y="202" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" 
          font-size="13" font-weight="600" fill="#94a3b8" letter-spacing="1">
      &quot;Rules Engine Decides, AI Explains&quot; &bull; Sub-Millisecond Policy Firewall
    </text>

    <!-- Three Architectural Pillar Badges -->
    <g transform="translate(0, 230)">
      
      <!-- Badge 1: Sub-0.05ms Airlock -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="210" height="34" rx="8" fill="#062828" fill-opacity="0.6" stroke="#10b981" stroke-width="1.2"/>
        <text x="14" y="21" font-family="ui-monospace, monospace" font-size="13" font-weight="700" fill="#34d399">⚡ Sub-0.05ms Airlock</text>
      </g>

      <!-- Badge 2: In-Memory Cache -->
      <g transform="translate(222, 0)">
        <rect x="0" y="0" width="200" height="34" rx="8" fill="#1e1538" fill-opacity="0.6" stroke="#8b5cf6" stroke-width="1.2"/>
        <text x="14" y="21" font-family="ui-monospace, monospace" font-size="13" font-weight="700" fill="#c084fc">💾 In-Memory Cache</text>
      </g>

      <!-- Badge 3: Mozilla Otari Powered -->
      <g transform="translate(434, 0)">
        <rect x="0" y="0" width="230" height="34" rx="8" fill="#2d1708" fill-opacity="0.6" stroke="#f97316" stroke-width="1.2"/>
        <text x="14" y="21" font-family="ui-monospace, monospace" font-size="13" font-weight="700" fill="#fb923c">🦊 Mozilla Otari Powered</text>
      </g>

    </g>

  </g>

  <!-- Right Decorative Telemetry HUD Graphic -->
  <g transform="translate(1040, 75)" opacity="0.85">
    <!-- Mini Terminal Box -->
    <rect x="0" y="0" width="110" height="170" rx="8" fill="#0a0f1d" stroke="#1e293b" stroke-width="1.2"/>
    <rect x="0" y="0" width="110" height="18" rx="8" fill="#131d33"/>
    <circle cx="10" cy="9" r="2.5" fill="#ef4444"/>
    <circle cx="18" cy="9" r="2.5" fill="#f59e0b"/>
    <circle cx="26" cy="9" r="2.5" fill="#10b981"/>
    
    <!-- Telemetry Lines -->
    <rect x="10" y="28" width="60" height="4" rx="2" fill="#38bdf8" opacity="0.8"/>
    <rect x="10" y="38" width="85" height="3" rx="1.5" fill="#475569"/>
    
    <text x="10" y="64" font-family="ui-monospace, monospace" font-size="9" font-weight="700" fill="#94a3b8">LATENCY</text>
    <text x="10" y="77" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#34d399">0.02 ms</text>
    
    <text x="10" y="99" font-family="ui-monospace, monospace" font-size="9" font-weight="700" fill="#94a3b8">TOKENS</text>
    <text x="10" y="112" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#38bdf8">0 BURNED</text>

    <text x="10" y="134" font-family="ui-monospace, monospace" font-size="9" font-weight="700" fill="#94a3b8">SLA ROUTE</text>
    <text x="10" y="147" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#818cf8">CLOSED</text>
  </g>
</svg>
